services:
  # Web Service - Next.js Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: mail-vault-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_URL=http://localhost:3000
      - AUTH_SECRET=your-secret-key-here-change-this-in-production
      - DATABASE_URL=file:./data/database/main.db
      - DATA_DIR=./data/accounts
      - ATTACHMENTS_DIR=./data/attachments
      - SYNC_INTERVAL_MINUTES=30
      - MAX_SYNC_ERRORS=5
      - SYNC_SERVICE_URL=http://sync:3001
      - SYNC_TRIGGER_TOKEN=change-me-shared-secret-between-web-and-sync
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - sync
    restart: unless-stopped
    networks:
      - mail-vault

  # Sync Service - IMAP Background Sync
  sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    container_name: mail-vault-sync
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/database/main.db
      - DATA_DIR=./data/accounts
      - ATTACHMENTS_DIR=./data/attachments
      - SYNC_INTERVAL_MINUTES=30
      - MAX_SYNC_ERRORS=5
      - SYNC_HTTP_HOST=0.0.0.0
      - SYNC_HTTP_PORT=3001
      - SYNC_TRIGGER_TOKEN=change-me-shared-secret-between-web-and-sync
    expose:
      - "3001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mail-vault

networks:
  mail-vault:
    driver: bridge
